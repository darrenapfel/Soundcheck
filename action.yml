name: "Soundcheck"
description: "Run Soundcheck voice-agent regression gates against your agent in CI."
branding:
  icon: "mic"
  color: "purple"

inputs:
  aut:
    description: >
      Path (in your repo) to your agent-under-test config (default-exports an AUTConfig).
      Required — its label keys the cassette lookup, so it is needed even for --replay.
    required: true
  scenarios:
    description: "Path (in your repo) to your scenarios directory."
    required: false
    default: "scenarios"
  cassette-dir:
    description: "Where your recorded cassettes live (relative to your repo), used by --replay."
    required: false
    default: "fixtures/cassettes"
  args:
    description: >
      EXTRA args to `soundcheck run` (e.g. `--only book-modify-confirm`, `--judge mock`). Do NOT
      put `--aut` here — use the `aut` input. Default `--replay` replays cassettes offline (no key);
      for a live run set `args: ""` and supply `deepgram-api-key`.
    required: false
    default: "--replay"
  deepgram-api-key:
    description: "DEEPGRAM_API_KEY — only needed for LIVE runs. Omit for the offline `--replay` default."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Soundcheck has ZERO runtime dependencies and runs TypeScript natively via Node 22's
    # --experimental-strip-types, so the consumer needs nothing installed but Node itself.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Run Soundcheck
      shell: bash
      env:
        DEEPGRAM_API_KEY: ${{ inputs.deepgram-api-key }}
        SOUNDCHECK_CASSETTE_DIR: ${{ inputs.cassette-dir }}
      run: >
        node --experimental-strip-types "$GITHUB_ACTION_PATH/src/cli.ts"
        run "${{ inputs.scenarios }}" --aut "${{ inputs.aut }}" ${{ inputs.args }}
