# Publish soundcheck-cli to npm via trusted publishing (OIDC — no stored token).
#
# Requires the one-time npm-side setup: on npmjs.com, the soundcheck-cli package's
# Settings → Trusted Publisher must name this repository and this workflow file
# (release.yml). Publishing then works only from this workflow in this repo, and
# npm attaches provenance attestations automatically.
#
# Deliberately NOT triggered on tag pushes: publishing is an explicit act —
# publish a GitHub Release, or dispatch this workflow manually.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a current npm CLI (OIDC support landed in 11.5).
      - run: npm install -g npm@latest
      - run: npm ci
      # The same gate as CI: typecheck + lint + the full offline suite, keyless.
      - run: npm run validate
      # And the packaged-artifact smoke: pack → install into a consumer → replay.
      - run: npm run smoke
      - run: npm publish
